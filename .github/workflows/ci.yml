name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running build.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --release -- -D warnings
      - run: cargo test --workspace --release

  riscv-tests:
    name: riscv-tests (rv64ui/um/ua/uc/si/mi, p + v)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: make -f tests/riscv-tests.mk -j"$(nproc)"
      - name: Build emulator
        run: cargo build --release -p rvcli
      - name: Run tests
        run: ./target/release/rvwasm test build/riscv-tests/*

  xv6:
    name: xv6 boot + usertests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build xv6 (rv64imac)
        run: ./scripts/build-xv6.sh
      - name: Build emulator
        run: cargo build --release -p rvcli
      - name: Boot to shell
        run: >
          ./target/release/rvwasm run build/xv6/kernel/kernel --disk build/xv6/fs.img
          --script 'echo booted-ok\n' --expect '\nbooted-ok' --max-cycles 3000000000
      - name: Determinism, snapshots and time travel
        run: cargo test --release -p rvcore --test timetravel
      - name: usertests -q
        timeout-minutes: 30
        run: >
          ./target/release/rvwasm run build/xv6/kernel/kernel --disk build/xv6/fs.img
          --script 'usertests -q\n' --expect 'ALL TESTS PASSED' --max-cycles 400000000000
      - uses: actions/upload-artifact@v4
        with:
          name: xv6-images
          path: |
            build/xv6/kernel/kernel
            build/xv6/fs.img

  linux:
    name: Linux 6.12 + BusyBox boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: >
          sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu gcc-riscv64-unknown-elf
          flex bison bc libelf-dev libssl-dev rsync
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel, musl, BusyBox and initramfs
        run: ./scripts/build-linux.sh
      - name: Build emulator
        run: cargo build --release -p rvcli
      - name: Boot and run commands
        run: >
          ./target/release/rvwasm run build/linux/Image --linux --initrd build/linux/initramfs.cpio.gz
          --prompt 'Try:' --script 'uname -a\nps\necho hello-busybox | sed s/hello/bye/\n'
          --expect '\nbye-busybox' --max-cycles 20000000000
      - uses: actions/upload-artifact@v4
        with:
          name: linux-images
          path: |
            build/linux/Image
            build/linux/initramfs.cpio.gz
            build/linux/System.map

  web:
    name: WebAssembly build + benchmarks
    needs: [xv6, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # for the gh-pages branch
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: xv6-images
          path: build/xv6
      - uses: actions/download-artifact@v4
        with:
          name: linux-images
          path: build/linux
      - name: Build benchmark programs
        run: ./scripts/build-bench.sh
      - name: Native benchmark
        run: |
          cargo build --release -p rvcli
          ./target/release/rvwasm bench --json build/bench-native.json
      - name: Build WebAssembly package and site
        run: ./scripts/build-web.sh
      - name: WebAssembly benchmark (Node)
        run: node bench/wasm-bench.mjs --json build/bench-wasm.json
      - name: Report
        run: |
          {
            echo "## Native vs WebAssembly"
            echo
            echo "Same runner, same workloads; MIPS = million guest instructions per second."
            echo
            node bench/compare.mjs build/bench-native.json build/bench-wasm.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/bench-*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # The same site on a gh-pages branch, for Pages set to "Deploy from a
      # branch" (the deploy job below covers the "GitHub Actions" source).
      - name: Publish to gh-pages branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          touch web/.nojekyll
          cd web
          git init -q -b gh-pages
          git config user.name "Priyansh Sharma"
          git config user.email "217270841+PS12007@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Site build from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [web, riscv-tests]
    runs-on: ubuntu-24.04
    # Needs Settings -> Pages -> Source: "GitHub Actions". Until that is set,
    # a failed deploy should not mark the whole run red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy + unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --release -- -D warnings
      - run: cargo test --workspace --release

  riscv-tests:
    name: riscv-tests (rv64ui/um/ua/si/mi, p + v)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build tests
        run: make -f tests/riscv-tests.mk -j"$(nproc)"
      - name: Build emulator
        run: cargo build --release -p rvcli
      - name: Run tests
        run: ./target/release/rvwasm test build/riscv-tests/*

  xv6:
    name: xv6 boot + usertests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu binutils-riscv64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build xv6 (rv64ima)
        run: ./scripts/build-xv6.sh
      - name: Build emulator
        run: cargo build --release -p rvcli
      - name: Boot to shell
        run: >
          ./target/release/rvwasm run build/xv6/kernel/kernel --disk build/xv6/fs.img
          --script 'echo booted-ok\n' --expect '\nbooted-ok' --max-cycles 3000000000
      - name: usertests -q
        timeout-minutes: 30
        run: >
          ./target/release/rvwasm run build/xv6/kernel/kernel --disk build/xv6/fs.img
          --script 'usertests -q\n' --expect 'ALL TESTS PASSED' --max-cycles 400000000000
      - uses: actions/upload-artifact@v4
        with:
          name: xv6-images
          path: |
            build/xv6/kernel/kernel
            build/xv6/fs.img

  linux:
    name: Linux 6.12 boot
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-linux-gnu flex bison bc libelf-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build kernel + initramfs
        run: ./scripts/build-linux.sh
      - name: Build emulator
        run: cargo build --release -p rvcli
      - name: Boot and run commands
        run: >
          ./target/release/rvwasm run build/linux/Image --linux --initrd build/linux/initramfs.cpio.gz
          --prompt "'help'." --script 'uname\nwrite /tmp/hi hello-from-linux\ncat /tmp/hi\n'
          --expect '\nhello-from-linux' --max-cycles 8000000000
      - uses: actions/upload-artifact@v4
        with:
          name: linux-images
          path: |
            build/linux/Image
            build/linux/initramfs.cpio.gz

  web:
    name: WebAssembly build + benchmarks
    needs: [xv6, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install RISC-V toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: xv6-images
          path: build/xv6
      - uses: actions/download-artifact@v4
        with:
          name: linux-images
          path: build/linux
      - name: Build benchmark programs
        run: ./scripts/build-bench.sh
      - name: Native benchmark
        run: |
          cargo build --release -p rvcli
          ./target/release/rvwasm bench --json build/bench-native.json
      - name: Build WebAssembly package and site
        run: ./scripts/build-web.sh
      - name: WebAssembly benchmark (Node)
        run: node bench/wasm-bench.mjs --json build/bench-wasm.json
      - name: Report
        run: |
          {
            echo "## Native vs WebAssembly"
            echo
            echo "Same runner, same workloads; MIPS = million guest instructions per second."
            echo
            node bench/compare.mjs build/bench-native.json build/bench-wasm.json
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: build/bench-*.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, riscv-tests]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
